<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Heading -->
        <h1>My To-Do List</h1>

        <p class="subtitle">
            Add and manage your daily tasks
        </p>


        <!-- Input Area -->
        <div class="input-container">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>


        <!-- Clear All Button -->
        <button id="clearButton" class="clear-button">
            Clear All Tasks
        </button>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
